- Key: Key如何指挥反空降作战？
  中文: 如何指挥反空降作战？
  英文: How to Command Anti-Airborne Operations?
- Key: Key在途中击落敌方
  中文: '，在途中击落敌方<color=#a0ff50>房虫</color>后，其运送的敌方单位就会变得非常虚弱，趁机一鼓作气消灭它们！'
  英文: ',After shooting down the enemy <color=#a0ff50>Population Drone</color> mid-flight,
    the enemy units it carries will be severely weakened—seize the moment and wipe
    them out in one fell swoop!'
- Key: Key我试试。
  中文: 我试试。
  英文: Let me give it a try.
- Key: Key击落房虫……
  中文: 击落<color=#a0ff50>房虫</color>，并且消灭其运送的敌方单位
  英文: Shoot down the <color=#a0ff50>Population Drone</color> and eliminate the enemy
    units it transports.
- Key: Key这都能输，不可思议！
  中文: 这都能输，不可思议！
  英文: How could we lose this? Unbelievable!
- Key: Key玩家的操作你别猜。
  中文: 玩家的操作你别猜。
  英文: Never try to second-guess a player’s moves.
- Key: Key您已经掌握了反空降战术……
  中文: 您已经掌握了反空降战术，可在今后的作战中择机运用。
  英文: You have mastered anti-airborne tactics—feel free to deploy them opportunistically
    in future battles.
- Key: Key谨遵恩师教诲。
  中文: 谨遵恩师教诲。
  英文: I shall follow your teachings closely, Master.
- Key: Key即时战略游戏的操作……
  中文: "即时战略游戏的操作并不复杂，老年间便有四句童谣：\n    <color=#a0ff50>工程车</color>，造<color=#a0ff50>基地</color>；\n\
    \    基地又产工程车。\n    工程车，造<color=#a0ff50>兵营</color>，\n    兵营产兵欢乐多！"
  英文: "The controls of a real-time strategy game aren’t complicated. Back in the day,\
    \ there was a little nursery rhyme that went like this:\n    \"<color=#a0ff50>Construction\
    \ Vehicle</color>, build the <color=#a0ff50>Command Center</color>;\n    The Command\
    \ Center spawns more Construction Vehicles.\n    Construction Vehicle, build the\
    \ <color=#a0ff50>Barracks</color>,\n    Barracks pump out troops—endless joy for\
    \ us all!\""
- Key: Key听说还能造地堡炮台……
  中文: 听说工程车还可以造<color=#a0ff50>地堡</color>和<color=#a0ff50>炮台</color>，我也要试试。
  英文: I heard Construction Vehicles can also build <color=#a0ff50> Bunkers</color>
    and <color=#a0ff50> Turrets</color>. I want to give that a shot too.
- Key: Key造完基地应该……
  中文: 造完基地应该先安排工程车去采集<color=#a0ff50>晶体矿</color>和<color=#a0ff50>燃气矿</color>，这是一切生产建造的基础。此外建造<color=#a0ff50>民房</color>可以提升活动单位上限。
  英文: Once the Command Center is built, you should first send Construction Vehicles
    to harvest <color=#a0ff50> Crystal Ore</color> and <color=#a0ff50> Gas Ore</color>—this
    is the foundation of all production and construction. Additionally, building <color=#a0ff50>
    Supply Depots</color> increases your mobile unit cap.
- Key: Key我想单手拖动选中……
  中文: 我只想单手操作，拖动视口 和 选中多个单位 如何操作呢？
  英文: I only want to play with one hand. How do I pan the viewport and select multiple
    units?
- Key: Key拖动地面就可以……
  中文: "  拖动地面就可以移动视口，此外设置（齿轮图标）界面还有视口镜头投影切换、放大、缩小按钮。当然也支持双指缩放视口。\n  先点击右边<color=#a0ff50>框选</color>按钮，然后在屏幕中拖动，即可<color=#a0ff50>框选</color>多个单位。在设置（齿轮图标）界面中可以切换菱形<color=#a0ff50>框选</color>或方形<color=#a0ff50>框选</color>。\n\
    \  全程只要单手握持手机单指操作即可。"
  英文: " Drag the ground to move the viewport. Moreover, the Settings (gear icon) menu\
    \ has buttons for switching viewport projection, zooming in, and zooming out.\
    \ Pinch-to-zoom is also supported.\n   First, tap the <color=#a0ff50>Box Select</color>\
    \ button on the right, then drag across the screen to <color=#a0ff50>box-select</color>\
    \ multiple units. You can switch between diamond-shaped and square <color=#a0ff50>box\
    \ selection</color> modes in the Settings (gear icon) menu.\n The entire process\
    \ can be done with one hand holding the phone and a single finger operating.\""
- Key: Key只用一只手就能玩……
  中文: 只用一只手就能玩的RTS即时战略游戏，那岂不是跟刷短视频一样轻松？我一定要体验一下！
  英文: An RTS game you can play with one hand? That’s as effortless as scrolling through
    short videos! I definitely need to give it a try!
- Key: Key走你!
  中文: 走你!
  英文: Let’s go!
- Key: Key欢迎来到……
  中文: 欢迎来到<color=#a0ff50>即时战略指挥</color>，现在您要接受基础的训练
  英文: Welcome to <color=#a0ff50>Real-Time Strategy Command</color>. You will now receive
    basic training.
- Key: Key造基地方法……
  中文: 请点击<color=#a0ff50>建筑单位</color>=><color=#a0ff50>基地</color>按钮，再点击空白地面，稍后就能造出一个基地
  英文: Please tap the <color=#a0ff50>Structures</color> => <color=#a0ff50>Command Center</color>
    button, then tap an empty spot on the ground. A Command Center will be built shortly.
- Key: Key造活动单位方法……
  中文: 请点击<color=#a0ff50>活动单位</color>=><color=#a0ff50>工程车</color>按钮，稍后会在基地旁造出一个工程车
  英文: Please tap the <color=#a0ff50> Mobile Units</color> => <color=#a0ff50>Construction
    Vehicle</color> button. A Construction Vehicle will spawn next to the Command
    Center shortly.
- Key: Key工程车移动方法……
  中文: 现在您有工程车了，点击选中您的<color=#a0ff50>工程车</color>，再点击空旷地面，命令它走向目标点
  英文: Now you have a Construction Vehicle. Tap to select your <color=#a0ff50>Construction
    Vehicle</color>, then tap an open area on the ground to order it to move to the
    target location.
- Key: Key工程车采集晶体矿……
  中文: 很好！现在给您刷了一个<color=#a0ff50>晶体矿</color>，请点击晶体矿，让工程车在晶体矿和基地之间搬运晶体矿
  英文: Well done! A patch of <color=#a0ff50>Crystal Ore</color> has been spawned for
    you. Tap the Crystal Ore to send the Construction Vehicle to transport ore between
    the Crystal Ore deposit and the Command Center.
- Key: Key工程车采集燃气矿……
  中文: 很好！您的工程车正在采集晶体矿，请等他把晶体矿运回基地。现在，请先点<color=#a0ff50>取消选中</color>，再选中另一辆工程车去采集<color=#a0ff50>燃气矿</color>
  英文: Great! Your Construction Vehicle is harvesting Crystal Ore—wait for it to deliver
    the ore back to the Command Center. Now, please tap <color=#a0ff50> Deselect</color>
    first, then select another Construction Vehicle to harvest <color=#a0ff50> Gas
    Ore</color>.
- Key: Key工程车晶体矿已运到基地……
  中文: 您的工程车已把第一批晶体矿运到基地，请查看左上角<color=#a0ff50>晶体矿</color>数量变化
  英文: Your Construction Vehicle has delivered the first batch of Crystal Ore to the
    Command Center. Check the <color=#a0ff50>Crystal Ore</color> count in the top-left
    corner to see the change.
- Key: Key工程车造民房……
  中文: 等您存够20晶体矿后，请点击<color=#a0ff50>建筑单位</color>=><color=#a0ff50>民房</color>按钮，再点击一次空旷地面
  英文: Once you have saved up 20 Crystal Ore, tap the <color=#a0ff50>Structures</color>
    => <color=#a0ff50>Supply Depot</color> button, then tap an open spot on the ground
    again.
- Key: Key民房可提高活动单位上限……
  中文: 很好，民房可以提升您的活动单位数量上限
  英文: Excellent—Supply Depots increase your mobile unit cap.
- Key: Key工程车造兵营……
  中文: 等您存够30晶体矿后，请点击<color=#a0ff50>建筑单位</color>=><color=#a0ff50>兵营</color>按钮，再点击一次空旷地面，就能造出一个兵营
  英文: Once you have saved up 30 Crystal Ore, tap the <color=#a0ff50>Structures</color>
    => <color=#a0ff50>Barracks</color> button, then tap an open spot on the ground
    again to build a Barracks.
- Key: Key兵营可产枪兵……
  中文: 很好，兵营可以产出<color=#a0ff50>枪兵</color>和<color=#a0ff50>近战兵</color>。
  英文: Well done—the Barracks can produce <color=#a0ff50>Riflemen</color> and <color=#a0ff50>
    Melee Infantry</color>.
- Key: Key兵营造枪兵方法……
  中文: 请点击<color=#a0ff50>活动单位</color>=><color=#a0ff50>枪兵</color>按钮，10秒后会在兵营旁造出一个枪兵
  英文: Please tap the <color=#a0ff50> Mobile Units</color> => <color=#a0ff50>Rifleman</color>
    button. A Rifleman will spawn next to the Barracks in 10 seconds.
- Key: Key枪兵移动方法……
  中文: 点击选中您的枪兵，再点击地面，可以指挥他走向目标处
  英文: Tap to select your Rifleman, then tap the ground to command it to move to the
    target location.
- Key: Key让枪兵打怪……
  中文: 现在已在左边给您刷了一个怪，控制兵走到怪附近，兵会自动打怪。您可以点右下角<color=#a0ff50>取消选中</color>，然后拖动地面看看怪在哪里
  英文: An enemy unit has been spawned on the left side for you. Move your troops near
    the enemy, and they will attack automatically. You can tap <color=#a0ff50> Deselect</color>
    in the bottom-right corner, then drag the ground to locate the enemy.
- Key: Key多造兵去围攻敌人……
  中文: 您的兵阵亡了。可以多造点兵去围攻敌人
  英文: Your troops have been defeated. You can build more troops to siege the enemy.
- Key: Key造地堡防守……
  中文: 恭喜您消灭了敌人！现在左边给您刷了更多的怪。您可以造<color=#a0ff50>建筑单位</color>=><color=#a0ff50>地堡</color>，让兵进入地堡中，立足防守，再伺机进攻
  英文: Congratulations on eliminating the enemy! More enemy units have been spawned
    on the left side for you. You can build <color=#a0ff50> Bunkers</color> under
    <color=#a0ff50>Structures</color>, garrison your troops inside to hold your ground
    defensively, then wait for the right moment to launch a counterattack.
- Key: Key您胜利是天才！
  中文: 您取得了胜利！您真是指挥天才！
  英文: You have achieved victory! What a brilliant commander you are!
- Key: Key你的悟性很高……
  中文: '，你的悟性很高，10分钟就完成了其他学员一个月才能完成的训练，为师甚是欣慰！'
  英文: ', You are an incredibly fast learner—you completed the training that takes
    other students a whole month in just 10 minutes. Your master is truly delighted!'
- Key: Key我这都是些什么同学啊……
  中文: ……我这都是些什么同学啊，这么简单的操作还要学一个月吗？
  英文: '...What kind of classmates do I have? How can it take them a whole month to
    learn such simple controls?'
- Key: Key世风不古……
  中文: 唉，谁说不是呢！如今世风不古。遥想20年前，比你悟性更高的指挥天才比比皆是，大家经常自发研究切磋指挥技艺，更有无数学员的水平远超教官。实在令人怀念……
  英文: Sigh, tell me about it! The current generation just isn’t what it used to be.
    Thinking back to 20 years ago, there were countless commander prodigies with even
    greater aptitude than yours. Everyone would spontaneously study and exchange command
    skills, and countless students were far more skilled than their instructors. Those
    were truly the days...
- Key: Key这些前辈果真……
  中文: 这些前辈果真如此厉害吗？学生倒是想领教领教！
  英文: Were those seniors really that amazing? This student would love to test their
    mettle!
- Key: Key克制关系……
  中文: "在<color=#a0ff50>多人联机混战</color>和<color=#a0ff50>其他人的多人战局列表</color>可能会遇到他们，不要轻敌。要善用战斗单位的克制关系：\n\
    \  小兵 克制 坦克\n  坦克 克制 地堡和炮台\n  地堡和炮台 克制 小兵"
  英文: "In <color=#a0ff50> Multiplayer FFA</color> and <color=#a0ff50>Other Players'\
    \ Multiplayer Matches</color>, you might run into them—never underestimate your\
    \ opponents. Make good use of the unit counter relationships:\n    Infantry counter\
    \ Tanks.\n    Tanks counter Bunkers and Turrets\n    Bunkers and Turrets counter\
    \ Infantry"
- Key: Key这些克制关系是怎么……
  中文: 这些克制关系是怎么产生的呢？
  英文: How do these counter relationships work?
- Key: Key坦克和近战兵……
  中文: "    坦克虽然伤害最高，但是价格昂贵，攻击前摇最久，移动速度最慢；<color=#a0ff50>前摇开始后炸点无法改变</color>，敌方单位很容易躲开炸点，此外坦克炸点的爆炸溅射会伤害附近的己方单位。\n\
    \    近战兵移动速度快，攻击速度快，价格便宜，很容易躲开坦克炸点，也很容易在坦克攻击前摇结束之前将坦克打掉。"
  英文: " Although Tanks have the highest damage output, they are expensive, have the\
    \ longest attack wind-up, and are the slowest-moving units; <color=#a0ff50>Once\
    \ the attack wind-up starts, the blast point cannot be changed</color>, so enemy\
    \ units can easily dodge it. Additionally, the splash damage from the tank’s blast\
    \ point will harm friendly units nearby.\n  Melee Infantry are fast-moving, quick\
    \ to attack, and cheap. They can easily dodge tank blast points and take down\
    \ tanks before the attack wind-up is complete."
- Key: Key坦克优势……
  中文: 坦克，攻击距离最远，可以<color=#a0ff50>在炮台和地堡内单位的射程外攻击</color>，是拆除建筑的利器。
  英文: Tanks have the longest attack range—they can <color=#a0ff50> attack from outside
    the range of Bunker and Turret garrisons</color>, making them excellent at destroying
    structures.
- Key: Key炮台介绍……
  中文: 炮台价格便宜，攻击速度快，攻击距离仅次于坦克，集中放置后可对快速移动的敌方小兵群体造成有效伤害。
  英文: Turrets are cheap, have a fast attack speed, and their attack range is second
    only to Tanks. When placed in groups, they can deal effective damage to swarms
    of fast-moving enemy infantry.
- Key: Key我会在实战中体会摸索。
  中文: 我会在实战中体会摸索。
  英文: I will learn and adapt through actual combat.
- Key: Key推荐防守战和攻坚战……
  中文: 一个人的时候，可以试试<color=#a0ff50>防守战</color>，有助于体会炮台、坦克、地堡的特点。也可以试试<color=#a0ff50>攻坚战</color>，练习步兵与坦克的配合
  英文: When playing alone, you can try <color=#a0ff50> Defensive Battles</color> to
    better understand the characteristics of Turrets, Tanks, and Bunkers. You can
    also try <color=#a0ff50> Assault Battles</color> to practice coordinating Infantry
    and Tanks.
- Key: Key训练失败鼓励……
  中文: 这只是一次训练，不必过于在意。失败是成功之母，待情绪平复可以再试一次。
  英文: This was just a training session—don’t dwell on it too much. Failure is the
    mother of success. You can try again when you’re feeling calmer.
