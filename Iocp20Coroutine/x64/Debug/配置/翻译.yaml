- Key: Key版本不匹配
  中文: 版本不匹配
  英文: Version Mismatch
- Key: Key进来了
  中文: ' 进来了'
  英文: ' Entered'
- Key: Key离开了
  中文: ' 离开了'
  英文: ' Left'
- Key: Key说
  中文: ' 说：'
  英文: ' Said:'
- Key: Key敌人
  中文: 敌人
  英文: Enemy
- Key: Key请稍后再说
  中文: 请稍后再说
  英文: Please speak again later.
- Key: Key单位介绍_虫_人类善于防守
  中文: 人类善于防守。驻守枪兵的地堡拥有顶级的攻防。现在请先点击右下角的<color=#a0ff50>框选</color>按钮，然后在屏幕上从左上到右下拖动，框选所有枪兵，然后点击<color=#a0ff50>地堡</color>，让选中的枪兵都进入地堡
  英文: Humans excel at defense. Bunkers garrisoned with Riflemen boast top-tier offense
    and defense. Now please first click the <color=#a0ff50> Box Selection</color>
    button at the bottom right corner, then drag from the top-left to bottom-right
    on the screen to select all Riflemen. Next, click the <color=#a0ff50> Bunker</color>
    to move all selected Riflemen inside.
- Key: Key现在会刷出大量敌人进攻地堡
  中文: 很好，现在会刷出大量敌人进攻地堡，让您对地堡的攻防有直观的体会。
  英文: Great. Now a large number of enemies will spawn and assault the bunker, allowing
    you to get a firsthand feel of the bunker's offensive and defensive capabilities.
- Key: Key但你的地堡也快不行了
  中文: '，祝贺你消灭了敌人，但你的地堡也快不行了。<color=#a0ff50>医疗兵</color>可以修复地堡。'
  英文: ',Congratulations on eliminating the enemies, but your bunker is almost destroyed.
    <color=#a0ff50> Medics</color> can repair the bunker.'
- Key: Key点击选中医疗兵
  中文: 点击选中<color=#a0ff50>医疗兵</color>，再点击一下地堡附近的空地，让医疗兵走到地堡附近。
  英文: Click to select a <color=#a0ff50> Medic</color>, then click an empty spot near
    the bunker to make the Medic move closer to it.
- Key: Key您的地堡正在恢复
  中文: 很好，您的地堡正在恢复。但是治疗会消耗医疗兵的能量，请注意医疗兵头顶的蓝色能量条变化
  英文: Well done. Your bunker is being restored. However, healing consumes the Medic's
    energy. Please pay attention to the changes in the blue energy bar above the Medic's
    head.
- Key: Key点击选中更多的医疗兵
  中文: 点击选中更多的<color=#a0ff50>医疗兵</color>走到地堡附近，让她们共同修复地堡。
  英文: Click to select more <color=#a0ff50> Medics</color> and move them near the bunker,
    so they can work together to repair it.
- Key: Key让地堡里的人出来
  中文: 现在请先点右下角的<color=#a0ff50>取消选中</color>，再点击选中<color=#a0ff50>地堡</color>，然后点击底部的<color=#a0ff50>离开地堡</color>按钮，让地堡里的人出来。
  英文: Now please first click <color=#a0ff50> Deselect</color> at the bottom right
    corner, then click to select the <color=#a0ff50> Bunker</color>, and finally click
    the <color=#a0ff50>Exit Bunker</color> button at the bottom to let the units inside
    come out.
- Key: Key医疗兵会治疗受伤的战斗单位
  中文: 很好，现在会刷出大量敌人向您进攻，医疗兵会治疗受伤的战斗单位。
  英文: Excellent. Now a swarm of enemies will spawn and launch an attack on you. The
    Medics will heal the wounded combat units.
- Key: Key左边出现了炮台群
  中文: 很好，左边出现了<color=#a0ff50>炮台</color>群，请派所有单位过去攻击（此训练不必在乎伤亡）
  英文: Great. A group of <color=#a0ff50>Turrets</color> has appeared on the left. Send
    all your units to attack them (casualties are not a concern in this training).
- Key: Key左边出现了炮台群_虫
  中文: '左边出现了<color=#a0ff50>炮台</color>群。请先点击选中一个<color = #a0ff50>近战虫</color>，然后再次点击选中同一个近战虫，达到选中附近所有近战虫的效果。接着点击左边炮台附近的空地，让所有近战虫进攻炮台（不必在乎伤亡）'
  英文: A group of <color=#a0ff50>Turrets</color> has appeared on the left. First, click
    to select a <color=#a0ff50> Melee Bug</color>, then click the same Melee Bug again
    to select all nearby Melee Bugs. Next, click an empty spot near the Turrets on
    the left to order all Melee Bugs to assault them (casualties are not a concern).
- Key: Key您可以试试攻城利器坦克
  中文: '，炮台群对步兵有压倒性的优势。您可以试试攻城利器：<color=#a0ff50>坦克</color>。'
  英文: ',Turrets have an overwhelming advantage against infantry. You can try using
    a siege weapon: the <color=#a0ff50> Tank</color>.'
- Key: Key坦克可以在炮台的射程外攻击
  中文: 坦克可以在炮台的射程外攻击
  英文: Tanks can attack from outside the Turrets' firing range.
- Key: Key不要进入炮台的射程内
  中文: 不要进入炮台的射程内！
  英文: Do NOT enter the Turrets' firing range!
- Key: Key你不早说……
  中文: 你不早说？
  英文: Why didn't you tell me earlier?
- Key: Key坦克会遭到小兵克制
  中文: '，坦克拥有射程优势，可以在炮台的射程外攻击。但是坦克爆炸溅射会伤害己方单位，并且前摇很长，会遭到小兵克制。现在请看效果。'
  英文: ',Tanks have a range advantage and can attack from beyond the Turrets'' firing
    range. However, tank explosion splash damage will harm friendly units, and their
    long attack wind-up makes them vulnerable to enemy grunts. Now watch the effect.'
- Key: Key敌方近战虫无法防空
  中文: 敌方近战虫无法防空，现在给你刷一个飞机即可克制它们。
  英文: Enemy melee bugs have no anti-air capabilities. Now I'll spawn an aircraft for
    you to counter them.
- Key: Key坦克和飞机的造价很高
  中文: 坦克和飞机的造价很高，要根据战场形势酌情使用。
  英文: Tanks and aircraft are expensive to build. Deploy them prudently based on battlefield
    conditions.
- Key: Key资源紧张时不造它们……
  中文: 好。资源紧张时不造它们。
  英文: Got it. Don't build them when resources are tight.
- Key: Key使用强行走来手动中断攻击……
  中文: 战斗单位会自动攻击警戒范围内的敌人，但你可以使用<color=#a0ff50>强行走</color>来手动中断攻击。
  英文: Combat units will automatically attack enemies within their alert range, but
    you can use <color=#a0ff50> Force Move</color> to manually interrupt their attacks.
- Key: Key然后点击下方的强行走按钮
  中文: 请单击选中飞机，然后点击下方的<color=#a0ff50>强行走</color>按钮，让飞机停止攻击并移动到炮台射程外。
  英文: Click to select the aircraft, then click the <color=#a0ff50> Force Move</color>
    button below to make the aircraft stop attacking and move outside the Turrets'
    firing range.
- Key: Key强行走的过程中……
  中文: 强行走的过程中，不会攻击敌人。
  英文: Unit will not attack enemies while performing a Force Move.
- Key: Key我知道了
  中文: 我知道了。
  英文: Understood.
- Key: Key了解地堡医疗兵坦克飞机的用法
  中文: 这次训练，你将了解<color=#a0ff50>地堡</color>、<color=#a0ff50>医疗兵</color>、<color=#a0ff50>坦克</color>、<color=#a0ff50>飞机</color>的用法。
  英文: In this training, you will learn how to use the <color=#a0ff50> Bunker</color>,
    <color=#a0ff50> Medic</color>, <color=#a0ff50>Tank</color> and <color=#a0ff50>Aircraft</color>.
- Key: Key好的。
  中文: 好的。
  英文: OK.
- Key: Key此单位不可进入地堡
  中文: 此单位不可进入地堡
  英文: This unit cannot enter the Bunker.
- Key: Key此单位不可进入房虫
  中文: 此单位不可进入房虫
  英文: This unit cannot enter the PopuLifter Drone.
