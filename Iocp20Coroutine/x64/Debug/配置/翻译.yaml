  中文: 蜕变进度{}/{}
  英文: Morph Progress {}/{}
- Key: Key待造队列{},当前单位进度{}/{}
  中文: 待造队列{},当前单位进度{}/{}
  英文: Queue Pending Construction {}, Current Unit Progress {}/{}
- Key: Key走向建造点
  中文: 走向建造点
  英文: Proceed to Construction Site
- Key: Key走向{}
  中文: 走向{}
  英文: Move toward {}
- Key: Key造完了
  中文: 造完了
  英文: Construction Complete
- Key: Key建造完成
  中文: 建造完成
  英文: Construction Complete
- Key: Key民房不足
  中文: 民房不足
  英文: Insufficient Supply Depots
- Key: Key房虫不足
  中文: 房虫不足
  英文: Insufficient Population Drones
- Key: Key正在建造
  中文: 正在建造
  英文: Under Construction
- Key: Key现在给你一批防空兵……
  中文: 现在给你一批防空兵。先<color=#a0ff50>框选</color>全部，然后点击飞虫附近的空白地面，进攻飞虫。优势在我！
  英文: You have been assigned a squad of anti-air units. First <color=#a0ff50> box-select</color>
    all of them, then click the empty ground near the Flying Bugs to order an attack.
    We hold the advantage!
- Key: Key先框选全部防空兵……
  中文: 先<color=#a0ff50>框选全部防空兵</color>，然后点击飞虫附近的空白地面，进攻飞虫。优势在我！
  英文: First <color=#a0ff50> box-select all anti-air units</color>, then click the
    empty ground near the Flying Bugs to order an attack. We hold the advantage!
- Key: Key防空战胜利……
  中文: 您胜利了！您真是防空天才！
  英文: You win! What an anti-air ace you are!
- Key: Key防空兵不可对地……
  中文: 防空兵对空大范围高伤害（不分敌我），不能攻击地面单位，需要其他单位保护。
  英文: Anti-air units deal massive area damage to airborne targets (friend or foe alike).
    They cannot attack ground units and must be protected by other friendly forces.
- Key: Key我会注意。
  中文: 我会注意。
  英文: I’ll keep that in mind.
- Key: Key敌方布置了防空兵……
  中文: 敌方布置了防空兵，我方飞虫损失惨重。
  英文: The enemy has deployed anti-air units, and our Flying Bugs are sustaining heavy
    casualties.
- Key: Key防空兵移动缓慢……
  中文: 防空兵<color=#a0ff50>移动缓慢，攻击前摇时间长，前摇过程中炸点不可改变位置</color>。只要手动操作飞虫避开空中炸点再找机会攻击，就有希望击败他们。
  英文: Anti-air units <color=#a0ff50> Move slowly and have a long attack wind-up. Once
    the wind-up initiates, the blast point cannot be repositioned</color>. You can
    defeat them by manually maneuvering your Flying Bugs to dodge the airborne blast
    points, then seizing the chance to counterattack.
- Key: Key具体如何操作呢？
  中文: 具体如何操作呢？
  英文: How exactly should I execute this?
- Key: Key所有飞虫在后方……
  中文: 所有飞虫在后方安全地区聚拢，然后派一只飞虫用<color=#a0ff50>强行走</color>吸引一个防空兵过来，群起而狙之。然后等飞虫自动恢复血量。如此反复，直至击败所有防空兵。
  英文: Gather all Flying Bugs in a safe rear area. Then send a single drone to <color=#a0ff50>
    Force Move</color> and lure one anti-air unit over, then focus fire to take it
    down. After that, wait for the Flying Bugs to regenerate HP automatically. Repeat
    this process until all enemy anti-air units are eliminated.
- Key: Key好的，我试试看。
  中文: 好的，我试试看。
  英文: Got it, let’s give it a shot.
- Key: Key反防空战胜利……
  中文: 您胜利了！您真是微操天才！
  英文: You win! You’re a micro-operation genius!
- Key: Key我没看错你的悟性很强……
  中文: 我果然没看错，你的悟性很强！
  英文: I knew I was right about you—you’re a fast learner!
- Key: Key您英材施教……
  中文: 您因材施教，总能点醒弟子困顿之处。弟子能有今日，皆因您引路人做得好，这份教导之恩，弟子铭记于心！
  英文: You tailor your teaching to the student, always clearing up the confusion that
    plagues your disciples. I wouldn’t be where I am today without your guidance as
    a mentor. I shall forever remember this debt of gratitude for your teachings!
- Key: Key反防空战失败……
  中文: 您失败了！您需要继续练习反防空技巧。
  英文: You lose! You need more practice with anti-anti-air warfare counter tactics.
- Key: Key再打防空战……
  中文: 可以点右上角<color=#a0ff50>离开场景</color>离开，然后再次点击<color=#a0ff50>反防空战</color>，就可以重新来过。
  英文: You can click <color=#a0ff50>Leave Scene</color> in the top-right corner to
    leave, then click <color=#a0ff50>Anti-Anti-Air Warfare</color> again to restart
    the mission.
- Key: Key敌方飞虫进攻我方炮台……
  中文: '，敌方飞虫进攻我方炮台，我方损失惨重。'
  英文: ', Enemy Flying Bugs are assaulting our artillery emplacements; we are sustaining
    heavy casualties.'
- Key: Key没有吧？
  中文: 没有吧？
  英文: Really?
- Key: Key现在请看……
  中文: 现在请看（无需操作）：
  英文: 'Now observe (no action required):'
- Key: Key飞虫炮台无需操作……
  中文: 敌方飞虫进攻我方炮台（此过程您无需操作）
  英文: Enemy Flying Bugs are assaulting our artillery emplacements (no action required
    on your part during this phase)
- Key: Key传授闪避技巧……
  中文: '，今日要传授你一门重要的闪避技巧。

    看，前方有一辆敌方坦克。坦克虽然伤害极高，但攻击前摇时间很长，且前摇开始后炸点位置无法改变。'
  英文: ', Today I will teach you an essential evasion technique.

    Look, there is an enemy tank ahead. While the tank deals devastating damage, it
    has an extremely long attack wind-up, and once the wind-up begins, the blast point
    cannot be repositioned.'
- Key: Key那弟子该如何应对？
  中文: 那弟子该如何应对？
  英文: What should this disciple do to counter it?
- Key: Key当坦克开始攻击前摇……
  中文: 当坦克开始攻击前摇时，地面上会出现炸点特效。仔细观察，一旦看到炸点特效出现，立刻使用<color=#a0ff50>强行走</color>身法，让枪兵迅速离开炸点位置。躲开炸点后，点击坦克附近的空白地面，让枪兵继续攻击坦克。如此反复，便能以弱胜强。
  英文: When the tank initiates its attack wind-up, a blast point visual cue will appear
    on the ground. Watch closely—once you see the blast point appear, immediately
    use the <color=#a0ff50> Force Move</color> maneuver to move your riflemen out
    of the blast zone quickly.After dodging the blast, click the empty ground near
    the tank to order the riflemen to resume their attack. Repeat this process, and
    you can defeat the stronger enemy with your weaker units.
- Key: Key谨记枪兵挑坦克心法……
  中文: 谨记此心法：<color=#a0ff50>观察炸点特效 → 强行走离开炸点 → 立刻继续攻击</color>。此乃枪兵对抗坦克的生存之道！
  英文: 'Commit this core principle to memory: <color=#a0ff50>Spot the blast point visual
    cue → Force Move away from the blast point → Resume attacking immediately</color>.
    This is the survival strategy for riflemen facing off against tanks!'
- Key: Key点枪兵再点击坦克……
  中文: 点击选中枪兵，再点击坦克附近的空白地面，让枪兵攻击坦克。仔细观察地面上的炸点特效，一旦看到炸点出现，立即使用<color=#a0ff50>强行走</color>身法离开炸点位置，然后点击坦克附近的空白地面继续攻击
  英文: Click to select the riflemen, then click the empty ground near the tank to order
    them to attack. Watch the ground carefully for the blast point visual cue—once
    it appears, use <color=#a0ff50> Force Move</color> to move away from the blast
    zone at once, then click the empty ground near the tank to continue the attack.
- Key: Key枪兵挑坦克失败……
  中文: 您失败了！您需要继续练习闪避技巧。
  英文: You lose! You need more practice with evasion techniques.
- Key: Key枪兵败切记……
  中文: '，枪兵已败。切记，面对强敌，闪避为先。仔细观察炸点特效，善用强行走身法躲开坦克炸点，方能在战场上立于不败之地。'
  英文: ', your riflemen have been defeated. Remember this: when facing a superior foe,
    evasion comes first. Watch closely for the blast point visual cue and master the
    Force Move maneuver to dodge the tank’s blasts—only then can you prevail on the
    battlefield.'
- Key: Key弟子谨记前辈教诲。
  中文: 弟子谨记前辈教诲。
  英文: This disciple shall heed the elder’s teachings.
- Key: Key兵挑坦克胜利……
  中文: 您胜利了！您真是微操天才！
  英文: You win! You’re a micro-operation genius!
- Key: Key少侠领悟枪兵对抗坦克……
  中文: '，你已领悟枪兵对抗坦克的闪避心法。

    切记，面对强敌，闪避比硬拼更为重要。仔细观察炸点特效，善用强行走身法躲开坦克炸点，你的枪兵便能在这险恶的战场上存活更久。'
  英文: ', you have mastered the evasion strategy for riflemen against tanks.

    Remember: when facing a stronger enemy, evasion is far more important than a head-on
    confrontation. Watch closely for the blast point visual cue and master the Force
    Move maneuver to dodge the tank’s blasts, and your riflemen will survive longer
    on this perilous battlefield.'
- Key: Key弟子谨记教诲心法……
  中文: 弟子谨记前辈教诲，定当善用此心法。
  英文: This disciple shall heed the elder’s teachings and make good use of this strategy.
- Key: Key人类即将入侵……
  中文: 情报显示：敌人已发现我们的巢穴入口，即将入侵，请做好准备。
  英文: 'Intel indicates: The enemy has located our hive entrance and is launching an
    invasion. Prepare for combat.'
- Key: Key我仅受过简单训练……
  中文: 可是我仅受过简单的指挥训练。
  英文: But I only received basic command training.
- Key: Key资源管够……
  中文: 我们会提供足够的初始晶体矿和燃气矿，你<color=#a0ff50>不用再从零开始采集</color>。
  英文: We will provide ample starting Crystal Ore and Gas Ore. You <color=#a0ff50>
    won’t need to gather resources from scratch</color>.
- Key: Key还是没把握……
  中文: 我还是没有把握。
  英文: I still don’t feel confident.
- Key: Key传授速成口诀……
  中文: 我会传授你指挥实战速成口诀，三分钟即可成为实战高手。
  英文: I’ll teach you the Rapid Combat Command Mantra—master real combat skills in
    just three minutes.
- Key: Key真有这种口诀……
  中文: 真有这种口诀的话就应该在训练战时告诉我啊！
  英文: If this mantra exists, you should’ve taught it to me during training drills!
- Key: Key只有在实战中才有用……
  中文: 实战口诀只有在九死一生的实战中才有用！
  英文: The mantra only works in do-or-die real battles!
- Key: Key九死一生……
  中文: 九死一生？形势严峻啊，我会全力以赴的!
  英文: Do-or-die? The situation is grim. I’ll give it everything I’ve got!
- Key: Key1个虫巢只能照顾……
  中文: 1个虫巢只能照顾<color=#a0ff50>3只幼虫</color>。<color=#a0ff50>让工虫变异更多的虫巢</color>，才有更多的幼虫可供蜕变。<color=#a0ff50>多蜕变房虫</color>，增加活动单位上限。
  英文: <color=#a0ff50>Only 3 Larvae</color> can be supported by a single Hive. <color=#a0ff50>Mutate
    Worker Drones into more Hives</color> to unlock more Larvae for morphing. <color=#a0ff50>Morph
    more Populifter Drones</color> to increase the mobile unit cap.
- Key: Key一定要在数量……
  中文: 就是一定要在数量上占据优势吗？
  英文: So the key is to overwhelm the enemy with sheer numbers?
- Key: Key进攻就是最好的防守……
  中文: 是的，进攻就是最好的防守。派出地面单位堵住敌人的通道，再派出飞虫越过障碍物空袭敌人。
  英文: Exactly. The best defense is a relentless offense. Deploy ground units to block
    enemy chokepoints, then send Flying Bugs over obstacles to attack enemies.
- Key: Key也不是很复杂……
  中文: OK，也不是很复杂。我有信心完成任务！
  英文: Alright, it’s not that complicated. I’m ready to complete the mission!
- Key: Key防守战只要守住……
  中文: 防守战：只要守住，就是胜利！
  英文: 'Defensive Mission: Victory belongs to those who hold the line!'
- Key: Key多造虫巢……
  中文: 5秒后将出现第1波敌人。多变异虫巢，多蜕变房虫，多蜕变近战虫枪虫和飞虫，一定要在数量上压倒敌人！
  英文: The first wave of enemies will spawn in 5 seconds. Mutate more Hives, morph
    more Populifter Drones, train more Melee Bugs, Rifle Bugs and Flying Bugs. Overwhelm
    the enemy with sheer numbers!
- Key: Key前期不用采集……
  中文: <color=#a0ff50>前期不用采集资源</color>。多变异虫巢，多蜕变房虫，多蜕变近战虫枪虫和飞虫，一定要在数量上压制敌人！
  英文: <color=#a0ff50>No need to gather resources in the early stage</color>. Mutate
    more Hives, morph more Populifter Drones, morph more Melee Bugs, Rifle Bugs and
    Flying Bugs. Suppress the enemy with sheer numbers!
- Key: Key第{}波敌人正向您走来
  中文: 第{}波敌人正向您走来
  英文: Wave {} is approaching your position.
- Key: Key虫族将进攻基地……
  中文: 情报显示：将有大量敌方单位进攻我方基地，请做好准备。
  英文: 'Intel update: A massive enemy battalion is assaulting our Command Center. Stand
    your ground!'
- Key: Key坦克超远超高伤害……
  中文: <color=#a0ff50>坦克</color>可以超远距离造成超高伤害，而且是范围伤害，但是坦克锁定炮弹落点后有超长前摇时长，前摇结束后，敌方目标可能已经远离炮弹落点。炮弹落点附近的我方单位也会受到伤害。
  英文: <color=#a0ff50>Tanks</color> deal devastating area damage at extreme range,
    but they suffer from a long charge-up time after locking onto a target. By the
    time the shell fires, enemy units may have already moved out of the blast zone.
    Friendly units near the impact area will also take splash damage.
- Key: Key有点鸡肋的感觉……
  中文: 有点鸡肋的感觉，不是红警中的高速坦克，与星际中的攻城坦克也有些不同。感觉更像帝国里的投石车。
  英文: Seems pretty underwhelming. Not like the fast tanks in Read Alert, or even the
    Siege Tanks in StandCraft. More like the Catapults from Age of Emperors.
- Key: Key有一种叫炮台的……
  中文: …不知道你在说什么…有一种叫<color=#a0ff50>炮台</color>的建筑单位，攻击距离很远，仅次于坦克；前摇时长很短，可以快速攻击；缺陷是伤害较低；不过多造点集中防守某一块区域还是很实用的。
  英文: …Not sure what you’re talking about… There’s a structure unit called the <color=#a0ff50>Turret</color>.
    It boasts exceptional range—second only to Tanks—with minimal charge-up time for
    rapid firing. Its downside is lower damage output, but massing them to defend
    key chokepoints proves highly effective.
- Key: Key坦克炮台就能……
  中文: 看来<color=#a0ff50>只要有坦克和炮台就能守住</color>对吗？
  英文: So <color=#a0ff50>as long as we have Tanks and Turrets, we can hold the line</color>,
    right?
- Key: Key是的能守住……
  中文: 是的，这是其他指挥官总结的经验。大概<color=#a0ff50>10个炮台和5辆坦克沿墙边布置就能守住</color>。当然还有其他多种可行的防守方法，要靠你自行摸索。
  英文: Affirmative. This is a proven strategy from veteran commanders. Position roughly
    <color=#a0ff50> 10 Turrets and 5 Tanks along the perimeter walls</color> to secure
    the Command Center. Of course, other viable defensive tactics exist—you’ll need
    to discover them on your own.
- Key: Key5秒出现虫族怪……
  中文: 5秒后将出现第1波怪。您可以沿右边墙边造炮台、布置坦克、造地堡、让兵进驻地堡。
  英文: Wave 1 incoming in 5 seconds. Construct Turrets along the right perimeter wall,
    deploy Tanks, build Bunkers, and garrison troops inside for fortified defense.
- Key: Key沿右边迷宫出口……
  中文: <color=#a0ff50>前期不用采集资源</color>。沿右边迷宫出口墙边布置一排<color=#a0ff50>炮台</color>，再放置<color=#a0ff50>坦克</color>加强防御。
  英文: <color=#a0ff50>No resource gathering required early-game</color>. Line the right
    maze exit wall with a row of <color=#a0ff50>Turrets</color>, then place <color=#a0ff50>Tanks</color>
    to reinforce your defenses.
- Key: Key总算报仇了！
  中文: 总算报仇了！
  英文: Finally—revenge is ours!
- Key: Key以后坦克不能……
  中文: 以后坦克不能再单独行动了，一定要带上步兵。
  英文: From now on, Tanks will never operate alone. Infantry escorts are mandatory.
- Key: Key是指挥官！
  中文: 是，指挥官！
  英文: Yes, Commander!
- Key: Key该听你的直接回去……
  中文: 早知如此就该听你的直接回去！
  英文: If only I’d listened to you and retreated earlier!
- Key: Key现在说什么都……
  中文: 现在说什么都晚了（惨叫）。
  英文: It’s too late for regrets now! (Screams)
- Key: Key下次先攻击虫巢……
  中文: 可以试试操作慢一点，先进攻<color=#a0ff50>右下角的虫巢</color>。
  英文: Try slowing your pace of operations. Prioritize attacking the <color=#a0ff50>Hive
    in the bottom-right corner</color> first.
- Key: Key只能下次再试试了。
  中文: 只能下次再试试了。
  英文: Guess we’ll have to go for the Key next time.
- Key: Key下次先攻击基地……
  中文: 可以试试操作慢一点，先进攻<color=#a0ff50>右下角的基地</color>。
  英文: Try slowing your pace of operations. Prioritize attacking the <color=#a0ff50>enemy
    Command Center in the bottom-right corner</color> first.
- Key: Key坦克连失联……
  中文: '，我的一个坦克连在调查<color=#a0ff50>虫巢</color>时失联，请前往营救。'
  英文: ',One of our Tank Companies went missing while investigating an enemy <color=#a0ff50>
    Hive</color>. Deploy immediately for search and rescue.'
- Key: Key没有步兵保护吗……
  中文: 坦克没有步兵保护吗？
  英文: Why weren’t the Tanks accompanied by infantry?
- Key: Key两个班的兵力……
  中文: 是的，步兵刚刚到位，两个班的兵力，现在全部交给你指挥。
  英文: Reinforcements just arrived—two infantry squads. They’re now under your full
    command.
- Key: Key虫巢是什么？
  中文: 虫巢是什么？
  英文: What exactly is a Hive?
- Key: Key虫巢苔蔓……
  中文: "侦察机传回的视频表明：虫巢周围会形成<color=#a0ff50>苔蔓(wàn)</color>，苔蔓上的虫类单位移动速度会变快，并且回血速度也会加快。应该<color=#a0ff50>避免在苔蔓上与虫类单位交战</color>。\n\
    \    据1985年《普通话异读词审音表》：\n        苔蔓(<color=#a0ff50>wàn</color>)、蔓(màn)延"
  英文: 'Recon drone footage confirms: <color=#a0ff50> Mossy Vines</color> grow around
    Hives. Insectoid units on these vines gain increased movement and regeneration
    speeds. <color=#a0ff50>Avoid engaging insectoid forces while on Mossy Vines</color>.'
- Key: Key坦克凭空消失……
  中文: 一个坦克连应该有10辆坦克吧？这么多钢铁疙瘩能凭空消失吗？
  英文: A Tank Company should have 10 Tanks, right? How could an entire unit of steel
    just vanish without a trace?
- Key: Key不放弃任何人……
  中文: 现在人手紧缺，我不能做任何行动上的承诺。但我个人会竭尽全力，不放弃任何一个人。
  英文: We’re short on manpower—no promises can be made for additional support. But
    personally, I’ll do everything in my power to bring every soldier home.
- Key: Key我会尽力而为的。
  中文: 我会尽力而为的。
  英文: I won’t let you down.
- Key: Key多想克制……
  中文: "要多用脑子，要多想。记住兵种克制关系：\n    <color=#a0ff50>小兵 克制 坦克\n    坦克 克制 炮台\n    炮台 克制 小兵</color>"
  英文: "Fight smart, not hard. Remember the unit counter rules:\n    <color=#a0ff50>Infantry\
    \ counter Tanks\n    Tanks counter Turrets\n    Turrets counter Grunts</color>"
- Key: Key早记住坦克步兵……
  中文: 这我早就记住了，否则我也不会疑惑为什么坦克没有步兵保护。
  英文: I already memorized them—that’s why I’m confused the Tanks were sent out without
    infantry support.
- Key: Key相信你归来……
  中文: 我相信你的能力，你一定能平安归来!
  英文: I have faith in your abilities. You will return victorious!
- Key: Key无工程车打虫巢……
  中文: 此局没有工程车。<color=#a0ff50>右下方的敌方虫巢防守薄弱</color>。
  英文: No Construction Vehicle available in this mission. <color=#a0ff50>The enemy
    Hive in the bottom-right corner is lightly defended</color>.
- Key: Key谢谢你救了我们。
  中文: 谢谢你救了我们。
  英文: Thank you for rescuing us.
- Key: Key你们怎么会在……
  中文: 你们怎么会在虫巢里？
  英文: What were you doing inside the Hive?
- Key: Key仿佛做梦……
  中文: 我也不知道，仿佛做了一场梦，什么都不记得了。
  英文: I don’t know. It’s like I was in a daze—I can’t remember anything.
- Key: Key我护送你……
  中文: 现在我的部队会护送你们回基地。到时候再仔细回忆一下。
  英文: My forces will escort you back to Command Center. We can try to piece together
    your memories once you’re safe.
- Key: Key两个虫巢……
  中文: 上面还有两个虫巢，我要炸掉它们再回去。
  英文: There are two more Hives up ahead. I’m destroying them before we retreat.
- Key: Key虫巢有炮台把守……
  中文: 上面的虫巢有敌方的炮台把守，我们过不去。
  英文: Those Hives are guarded by enemy Turrets. We can’t break through.
- Key: Key我的坦克专门……
  中文: 我的坦克专门克制炮台。<color=#a0ff50>坦克的射程略远于炮台</color>。一辆坦克就能全灭它们，何况我现在有十辆。
  英文: My Tanks are specifically designed to counter Turrets. <color=#a0ff50>Tanks
    outrange Turrets by a small margin</color>. One Tank alone can wipe them out—now
    imagine what 10 can do.
- Key: Key坦克接受我指挥……
  中文: 好的，但是坦克要接受我的指挥，我的步兵会保护坦克。
  英文: Very well, but the Tanks will follow my orders. My infantry will provide escort.
- Key: Key是明白指挥官……
  中文: 是！明白！指挥官！
  英文: Yes! Understood, Commander!
- Key: Key消灭虫巢……
  中文: 消灭上方两个敌方虫巢，控制好步兵保护您的坦克。<color=#a0ff50>让坦克在地方炮台的射程外攻击</color>。
  英文: Eliminate the two enemy Hives ahead. Use your infantry to protect the Tanks.
    <color=#a0ff50>Keep Tanks outside the Turrets’ firing range</color> at all times.
- Key: Key好消息拟态……
  中文: '，有一个好消息，我们的幼虫经过千万次的模仿，基本掌握了拟态复制人类三色坦克的方法。'
  英文: ',Good news: After thousands of iterations, our Larvae have mastered mimicking
    human Tri-Color Tank technology.'
- Key: Key还有坏消息……
  中文: 太好了……那么接下来肯定还有一个坏消息吧？
  英文: That’s great… But I’m guessing there’s a catch, isn’t there?
- Key: Key绿色坦克遭……
  中文: '是的，蜕变出的第一批<color = #a0ff50>绿色坦克</color>的虫巢已遭人类攻占。'
  英文: Regrettably, the Hive producing our first batch of <color=#a0ff50> Green Tanks</color>
    has been captured by human forces.
- Key: Key绿色坦克打不过……
  中文: 绿色坦克看来仍然打不过人类的部队啊！
  英文: So the Green Tanks still can’t stand up to human troops.
- Key: Key绿色坦克劣势……
  中文: 绿色坦克攻击距离远，但是面对贴近的人类步兵却处于劣势。此外绿色坦克发射出的光刺会被障碍物阻挡。现在人类的科学家正在研究我们的绿色坦克。
  英文: Green Tanks excel at long-range combat but are vulnerable to enemy infantry
    at close quarters. Additionally, their Light Orbs can be blocked by obstacles.
    Worse yet, human scientists are now reverse-engineering our Green Tank technology.
- Key: Key我现在去救它们。
  中文: 我现在去救它们。
  英文: I’m mounting a rescue mission—now!
- Key: Key无工虫打基地……
  中文: 此局没有工虫。<color=#a0ff50>右下方的敌方基地防守薄弱</color>。
  英文: No Worker Drones available in this mission. <color=#a0ff50>The enemy Command
    Center in the bottom-right corner is lightly defended</color>.
- Key: Key你们怎么会在基地里？
  中文: 你们怎么会在基地里？
  英文: What were you doing inside the enemy Command Center?
- Key: Key护送回虫巢……
  中文: 现在我的部队会护送你们回虫巢。到时候再仔细回忆一下。
  英文: My forces will escort you back to the Hive. We can try to recover your memories
    once you’re safe.
- Key: Key炸掉基地……
  中文: 上面还有两个基地，我要炸掉它们再回去。
  英文: There are two more enemy Command Centers up ahead. I’m destroying them before
    we retreat.
- Key: Key基地有炮台……
  中文: 上面的基地有敌方的炮台把守，我们过不去。
  英文: Those Command Centers are guarded by enemy Turrets. We can’t break through.
- Key: Key我克制炮台……
  中文: 我专门克制炮台。<color=#a0ff50>坦克的射程略远于炮台</color>。一辆坦克就能全灭它们，何况我们现在有十辆。
  英文: I specialize in countering Turrets. <color=#a0ff50>Tanks outrange Turrets by
    a small margin</color>. One Tank alone can wipe them out—now imagine what 10 can
    do.
- Key: Key我保护你们……
  中文: 好的，但是你们要接受我的指挥，我的部队会保护你们。
  英文: Very well, but you will follow my orders. My forces will provide escort.
- Key: Key消灭上方基地……
  中文: 消灭上方两个敌方基地，控制好其它单位保护您的坦克。坦克的射程略远于炮台，<color=#a0ff50>不要让坦克进入敌方炮台的射程</color>。
  英文: Eliminate the two enemy Command Centers ahead. Use your other units to protect
    the Tanks. Tanks outrange Turrets by a small margin—<color=#a0ff50>never let Tanks
    enter the Turrets’ firing range</color>.
- Key: Key无坦克遇炮台……
  中文: 没有坦克又遇到大片敌方炮台怎么办？
  英文: What if we face a large battery of enemy Turrets without any Tanks?
- Key: Key绕道空降……
  中文: '，可以让<color=#a0ff50>房虫</color>运送战斗单位越过障碍物绕到炮台后方，实施空降作战。'
  英文: ',You can use <color=#a0ff50>PopuLifter Drone</color> to transport combat units
    over obstacles and deploy them behind enemy Turrets for airborne assaults.'
- Key: Key近战虫进房虫……
  中文: 请先点击选中<color=#a0ff50>近战虫</color>，再点击一次<color=#a0ff50>房虫</color>，可让近战虫进入房虫。
  英文: First, select the <color=#a0ff50> Melee Bug</color>. Then, click on a <color=#a0ff50>PopuLifter
    Drone</color> to load the Melee Bugs inside.
- Key: Key放下近战虫……
  中文: 很好，请点击选中<color=#a0ff50>房虫</color>，让它跃过左侧的障碍物到达左上角的敌方建筑附近，然后点击下方<color=#a0ff50>离开房虫</color>图标，放下近战虫攻击敌方建筑
  英文: Excellent work. Now select the <color=#a0ff50> PopuLifter Drone</color> and
    order it to jump over the obstacles on the left, moving near the enemy structures
    in the top-left corner. Next, click the <color=#a0ff50> Disembark</color> icon
    below to unload the Melee Bugs and launch an attack on the enemy structures.
- Key: Key要远离敌方炮台。
  中文: 要远离敌方炮台。
  英文: Maintain distance from enemy Turrets.
- Key: Key已掌握空空降……
  中文: 您已经掌握了空降战术，但此战术风险较高，遭敌方拦截时会非常被动。可在今后的作战中择机运用。
  英文: You have mastered the airborne assault tactic. Note that this tactic carries
    high risks—you will be vulnerable if intercepted by the enemy. Use it strategically
    in future battles.
- Key: Key没看错你天才……
  中文: '，我果然没有看错你，你是一个指挥天才！'
  英文: ',I knew I made the right choice putting you in command—you’re a natural-born
    tactician!'
- Key: Key都快打完了……
  中文: 都快打完了你才来？
  英文: Took you long enough to show up—we’re almost done fighting!
- Key: Key兵家常事……
  中文: 胜败乃兵家常事，我仍然看好你的潜力！
  英文: Victory and defeat are part of war. I still see great potential in you!
- Key: Key八个方向都……
  中文: '，八个方向都会有敌人向你进攻！'
  英文: ',Enemies are closing in on your position from eight directions!'
- Key: Key谁敢欺负咱俩……
  中文: 要战便战！谁敢欺负咱俩？
  英文: Bring it on! No one dares to mess with us!
- Key: Key星河孤守歌……
  中文: "教官让我转给你1000晶体矿，如果不够就只能现场采集。你先顶住，我马上去找援军支援你！我现在赠你《星河孤守歌》与你共勉：\n     星河擂战鼓，虫影蔽天帷。\n\
    \     孤城锁铁衣，硝烟裂云楣。\n     血浸山河脊，骨铸不摧碑。\n     待我踏风雪，元帅载曦归！\n               ————文小言AI"
  英文: "The Drill Instructor sent 1000 Crystal Ore. If that’s not enough, you’ll have\
    \ to gather more on-site. Hold the line—I’m mobilizing reinforcements right now!\
    \ I leave you with this poem, Ode to the Lone Star Fortress, to keep your spirits\
    \ high:\n    Battle drums roar across the starry river, insect swarms blot out\
    \ the sky.\n    The lone fortress stands clad in iron, gunsmoke tears through\
    \ the clouds.\n    Blood stains the backbone of mountains and rivers, bones forge\
    \ an unyielding monument.\n    When I return through wind and snow, the Marshal\
    \ shall come home with the dawn!\n        ————By ERNIE Bot Mini AI"
- Key: Key像临阵逃脱……
  中文: "！……这说的什么玩意？听起来还有点像临阵脱逃的说辞！\n  好吧，我一定守住！"
  英文: "    !...What kind of nonsense is this? Sounds like an excuse to run away!\n\
    \    Fine. I’ll hold the line—no matter what!"
- Key: Key守中央基地……
  中文: 守护中央<color=#a0ff50>基地</color>，否则任务失败。
  英文: Defend the <color=#a0ff50>Central Command Center</color>, or the mission will
    fail.
- Key: Key援军来了。
  中文: 援军来了。
  英文: Reinforcements have arrived!
- Key: Key来得正是时候……
  中文: 来得正是时候，这回定要出口恶气！
  英文: About time! This time, we’re settling the score once and for all!
- Key: Key胜利就在眼前……
  中文: 守护中央<color=#a0ff50>基地</color>，胜利就在眼前。
  英文: Defend the <color=#a0ff50>Central Command Center</color> — victory is within
    reach.
- Key: Key了解绿色坦克飞虫……
  中文: 这次训练，你将了解<color=#a0ff50>绿色坦克</color>、<color=#a0ff50>飞虫</color>的用法。
  英文: In this training, you will learn how to use the <color=#a0ff50> Green Tank</color>
    and <color=#a0ff50> Flying Bug</color>.
- Key: Key选近战虫进攻炮台……
  中文: '左边出现了<color=#a0ff50>炮台</color>群。请先点击选中一个<color = #a0ff50>近战虫</color>，然后再次点击选中同一个近战虫，达到选中附近所有近战虫的效果。接着点击左边炮台附近的空地，让所有近战虫进攻炮台（不必在乎伤亡）'
  英文: A cluster of <color=#a0ff50>Turrets</color> has appeared on the left. First,
    click to select a <color=#a0ff50> Melee Bug</color>, then click the same Melee
    Bug again to select all nearby Melee Bugs. Next, click the empty area near the
    left-side Turrets to order all Melee Bugs to attack the Turrets (casualties are
    irrelevant).
- Key: Key绿色坦克克制炮台……
  中文: '，炮台群对地面单位有压倒性的优势。可以用<color=#a0ff50>绿色坦克</color>可以在炮台的射程外攻击。'
  英文: ',Turret clusters hold overwhelming superiority over ground units. You can use
    <color=#a0ff50> Green Tanks</color> to attack from outside the Turrets'' range.'
- Key: Key绿色坦克可以……
  中文: 绿色坦克可以在炮台的射程外攻击
  英文: Green Tanks can strike from beyond the Turrets' firing range.
- Key: Key绿色坦克拥有……
  中文: '，绿色坦克拥有射程优势，可以在炮台的射程外攻击。但是绿色坦克发射的光刺会被障碍物阻挡，会遭到小兵克制。现在请看效果。'
  英文: ',Green Tanks have a range advantage and can attack from outside the Turrets''
    reach. However, the Light Orbs they fire are blocked by obstacles, and they are
    countered by basic infantry units. Observe the demonstration now.'
- Key: Key飞虫克制……
  中文: 敌方近战兵无法防空，现在给你刷一个飞虫即可克制它们。
  英文: Enemy melee infantry have no anti-air capabilities. Deploy a Flying Bug to counter
    them effectively.
- Key: Key消灭所有敌方近战兵
  中文: 消灭所有敌方近战兵
  英文: Eliminate all enemy melee infantry units.
- Key: Key绿色坦克造价……
  中文: 绿色坦克和飞虫的造价很高，要根据战场形势酌情使用。
  英文: Green Tanks and Flying Bugs have high production costs. Deploy them strategically
    based on battlefield conditions.
- Key: Key飞虫强行走……
  中文: 请单击选中飞虫，然后点击下方的<color=#a0ff50>强行走</color>按钮，让飞虫停止攻击并移动到指定位置。
  英文: Click to select a Flying Bug, then press the <color=#a0ff50> Force Move</color>
    button below to make it cease attacking and move to the designated location.
- Key: Key守住指挥天才……
  中文: 您守住了！您真是指挥天才！
  英文: You held your ground! What a tactical genius you are!
- Key: Key少侠，欢迎来到虫族武学殿堂……
  中文:  少侠，欢迎来到虫族武学殿堂。今日，老夫要传授你一门重要的保命心法。
  英文: ' Young warrior, welcome to the Insectoid Martial Hall. Today, this old one
    shall teach you a vital survival technique.'
- Key: Key敢问前辈，是何心法？
  中文: 敢问前辈，是何心法？
  英文: Honorable master, what technique is this?
- Key: Key看，前方有一座敌方的炮台……
  中文: 看，前方有一座敌方的炮台。你的飞虫虽然身法灵活，但气血较少，若一味硬拼，必败无疑。
  英文: Behold! An enemy Turret lies ahead. Your Flying Bugs are agile but frail. A
    head-on assault will surely lead to defeat.
- Key: Key切记观察飞虫的气血……
  中文: '切记观察飞虫的气血。飞虫气血本就较少，当气血低于一半时，立刻施展<color=#a0ff50>强行走</color>身法，让飞虫回到<color=#a0ff50>苔蔓</color>之上。

    在苔蔓之上，飞虫可快速调息恢复气血。待气血回满之后，点击炮台附近的空白地面，让飞虫继续攻敌。如此反复，方能以弱胜强。

    谨记此心法：<color=#a0ff50>气血低于一半 → 强行走回苔蔓 → 调息回满气血 → 点击炮台附近空白地面继续攻敌</color>。此乃飞虫的生存之道！'
  英文: "  Always monitor your Flying Bugs' health. Their vitality is inherently low.\
    \ When their health drops below 50%, immediately activate the <color=#a0ff50>\
    \ Force Move</color> ability to retreat them to the <color=#a0ff50> Mossy Vines</color>.\n\
    \  On the Mossy Vines, Flying Bugs recover health rapidly. Once fully healed,\
    \ click the empty area near the Turret to resume the attack. Repeat this cycle\
    \ to overcome a stronger foe with a weaker force.\n  Remember this core principle:\
    \ <color=#a0ff50>Health Below 50% → Force Move to Mossy Vines → Regenerate Full\
    \ Health → Click Turret Vicinity to Attack Again</color>. This is the way of survival\
    \ for Flying Bugs!"
- Key: Key点击选中飞虫……
  中文: 点击选中飞虫，再点击炮台附近的空白地面，让飞虫攻击炮台。当气血低于一半时，使用<color=#a0ff50>强行走</color>身法回到苔蔓调息回血
  英文: Click to select a Flying Bug, then click the empty area near the Turret to order
    it to attack. When its health falls below half, use <color=#a0ff50> Force Move</color>
    to retreat to the Mossy Vines and regenerate health.
- Key: Key继续练习保命技巧……
  中文: 您失败了！您需要继续练习保命技巧。
  英文: You have failed! You must practice your survival skills further.
- Key: Key少侠，飞虫已败……
  中文: ' 少侠，飞虫已败。切记，江湖险恶，保命为先。善用苔蔓调息回血，方能在战场上立于不败之地。'
  英文: ' Young warrior, your Flying Bugs have been defeated. Remember—danger lurks
    everywhere in this battlefield. Survival comes first. Master the use of Mossy
    Vines for health regeneration, and you will stand invincible in combat.'
- Key: Key少侠已领悟飞虫的保命心法……
  中文: '少侠已领悟飞虫的保命心法。

    切记，江湖之中，保命比硬拼更为重要。善用苔蔓调息回血，你的飞虫便能在这险恶的战场上存活更久。'
  英文: "  You have mastered the Flying Bug survival technique.\n  Always remember:\
    \ survival outweighs reckless fighting in this world. Use the Mossy Vines to regenerate\
    \ health wisely, and your Flying Bugs will endure longer in this perilous battlefield."
- Key: Key训练失败。
  中文: 训练失败。
  英文: Training Failed.
- Key: Key你醒了?
  中文: 你醒了?
  英文: You're awake?
- Key: Key我们到家了吗？
  中文: 我们到家了吗？
  英文: Are we home yet?
- Key: Key我们回到地球……
  中文: 是的，我们回到地球了。但是地球已被人类占据。
  英文: Yes, we have returned to Earth. But it is now occupied by humans.
- Key: Key我们仅仅离开……
  中文: 我们仅仅离开了6000万年而已，想不到啊……一定要夺回我们的家园！
  英文: We were only gone for 60 million years... Unthinkable! We must reclaim our home!
- Key: Key你睡得太久……
  中文: 你睡得太久，需要一些恢复训练才能投入战斗！
  英文: You have slumbered for far too long. You need recovery training before entering
    battle.
- Key: Key请点击虫巢按钮……
  中文: 请点击<color=#a0ff50>建筑单位</color>=><color=#a0ff50>虫巢</color>按钮，再点击空白地面，工虫会变异为虫巢
  英文: Click the <color=#a0ff50>Structures</color> => <color=#a0ff50>Hive</color> button,
    then click an empty spot on the ground. Worker Drones will mutate into a Hive.
- Key: Key虫巢周围会形成……
  中文: "  很好。虫巢周围会形成<color=#a0ff50>苔蔓(wàn)</color>，苔蔓上的虫类单位移动速度会变快，并且回血速度也会加快。应该<color=#a0ff50>尽量在苔蔓上与敌方单位交战</color>。\n\
    \   等虫巢产出<color=#a0ff50>幼虫</color>后，请点击<color=#a0ff50>活动单位</color>=><color=#a0ff50>工虫</color>按钮，让幼虫蜕变为工虫"
  英文: 'Excellent. <color=#a0ff50> Mossy Vines</color> will spread around the Hive.
    Insectoid units on the Mossy Vines gain increased movement speed and health regeneration
    rate. <color=#a0ff50>Always engage enemy units on the Mossy Vines whenever possible</color>.

    Once the Hive produces <color=#a0ff50>Larvae</color>, click the <color=#a0ff50>
    Mobile Units</color> => <color=#a0ff50>Worker Drone</color> button to morph the
    Larvae into Worker Drones.'
- Key: Key现在您有工虫了……
  中文: 现在您有工虫了，点击选中您的<color=#a0ff50>工虫</color>，再点击空旷地面，命令它走向目标点
  英文: Now you have Worker Drones. Click to select a <color=#a0ff50>Worker Drone</color>,
    then click an open area to command it to move to the target location.
- Key: Key工虫采集晶体矿……
  中文: 很好！现在给您刷了一个晶体矿，请点击选中<color=#a0ff50>工虫</color>，再点击一次<color=#a0ff50>晶体矿</color>，让工虫在晶体矿和虫巢之间搬运晶体矿
  英文: Well done! A <color=#a0ff50>Crystal Ore</color> deposit has been spawned for
    you. Click to select a <color=#a0ff50>Worker Drone</color>, then click the <color=#a0ff50>Crystal
    Ore</color> to order it to transport ore between the deposit and the Hive.
- Key: Key工虫采集燃气矿……
  中文: 很好！您的工虫正在采集晶体矿，请等他把晶体矿运回虫巢。现在，请先点<color=#a0ff50>取消选中</color>，再蜕变一个工虫去采集<color=#a0ff50>燃气矿</color>
  英文: Great! Your Worker Drone is harvesting Crystal Ore. Wait for it to deliver the
    ore to the Hive. Now, first click <color=#a0ff50 > Deselect</color>, then morph
    another Worker Drone to harvest the <color=#a0ff50> Gas Ore</color>.
- Key: Key工虫已运晶体矿……
  中文: 您的工虫已把第一车晶体矿运到基地，请查看<color=#a0ff50>左上角</color>晶体矿数量变化
  英文: Your Worker Drone has delivered the first batch of Crystal Ore to the Command
    Center. Check the <color=#a0ff50>top-left corner</color> to see the Crystal Ore
    count increase.
- Key: Key蜕变房虫……
  中文: 等您存够20晶体矿后，请点击<color=#a0ff50>活动单位</color>=><color=#a0ff50>房虫</color>按钮，让幼虫蜕变为房虫
  英文: Once you have accumulated 20 units of Crystal Ore, click the <color=#a0ff50>
    Mobile Units</color> => <color=#a0ff50>PopuLifter Drone</color> button to morph
    Larvae into PopuLifter Drones.
- Key: Key房虫提升……
  中文: 很好，房虫可以提升您的<color=#a0ff50>活动单位数量上限</color>
  英文: Excellent. PopuLifter Drones increase your <color=#a0ff50> Mobile Unit Cap</color>.
- Key: Key变异虫营……
  中文: 等您存够30晶体矿后，请点击<color=#a0ff50>建筑单位</color>=><color=#a0ff50>虫营</color>按钮，再点击覆盖有苔蔓(wàn)的地面，就能变异出一个虫营。
  英文: When you have 30 units of Crystal Ore, click the <color=#a0ff50>Structures</color>
    => <color=#a0ff50>Bug Barracks</color> button, then click the ground covered by
    Mossy Vines to mutate a Bug Barracks.
- Key: Key解锁枪虫……
  中文: 很好，虫营可以解锁枪虫和近战虫。虫营只要一个就够了，如果希望出兵更快，应该造更多的虫巢。
  英文: Well done. The Bug Barracks unlocks Rifle Bugs and Melee Bugs. One Bug Barracks
    is sufficient—build more Hives if you wish to produce units faster.
- Key: Key变异近战虫……
  中文: 请点击<color=#a0ff50>活动单位</color>=><color=#a0ff50>近战虫</color>按钮，让幼虫蜕变为近战虫
  英文: Click the <color=#a0ff50> Mobile Units</color> => <color=#a0ff50> Melee Bug</color>
    button to morph Larvae into Melee Bugs.
- Key: Key近战虫走……
  中文: 点击选中您的<color=#a0ff50>近战虫</color>，再点击地面，可以指挥它走向目标处
  英文: Click to select your <color=#a0ff50> Melee Bug</color>, then click the ground
    to direct it to move to the target location.
- Key: Key近战虫攻击敌人……
  中文: 现在已在左边给您刷了一个敌人，点击选中您的<color=#a0ff50>近战虫</color>，再<color=#a0ff50>点击敌人附近的地面</color>，近战虫会走向目标并自动攻击。您可以点右下角<color=#a0ff50>取消选中</color>然后拖动地面看看敌人在哪里
  英文: Enemies have been spawned on the left. Click to select your <color=#a0ff50>
    Melee Bug</color>, then <color=#a0ff50>click the ground near the enemies</color>—the
    Melee Bug will move to the target and attack automatically. You can click <color=#a0ff50>
    Deselect</color> in the bottom-right corner and drag the screen to locate the
    enemies.
- Key: Key近战虫阵亡……
  中文: 您的单位阵亡了。可以多造点近战虫和枪虫去围攻敌人
  英文: Your unit has been destroyed. Produce more Melee Bugs and Rifle Bugs to overwhelm
    the enemy with numbers.
- Key: Key变异更多虫巢……
  中文: 恭喜您消灭了敌人！现在左边给您刷了更多的敌人。您可以变异更多的<color=#a0ff50>虫巢</color>加快幼虫的产出，蜕变更多的<color=#a0ff50>房虫</color>提升活动单位上限，加油
  英文: Congratulations on eliminating the enemy! More enemies have been spawned on
    the left. You can mutate additional <color=#a0ff50> Hives</color> to speed up
    Larva production, and morph more <color=#a0ff50> PopuLifter Drones</color> to
    increase your unit cap. Keep fighting!
- Key: Key夺回地球……
  中文: '，很好，夺回地球指日可待！'
  英文: '，Excellent! Reclaiming Earth is within our grasp!'
- Key: Key期待与人类……
  中文: 期待与人类的实战。
  英文: Looking forward to the real battle against humanity.
- Key: Key承蒙谬赞……
  中文: 承蒙谬赞。学生谨遵教诲，自不敢有一丝懈怠，定当不负所望，继续精进。
  英文: Your praise humbles me, master. This student shall follow your teachings diligently,
    never slacking off, and strive to live up to your expectations.
- Key: Key兵家常事点击……
  中文: 胜败乃兵家常事，请点击右上角<color=#a0ff50>离开场景</color>离开，就可以重新来过。
  英文: Victory and defeat are common in warfare. Click <color=#a0ff50>Leave Scene</color>
    in the top-right corner to restart the mission.
- Key: Key功败垂成……
  中文: 学生此次功败垂成，定会吸取教训，总结经验，再次努力，定不辜负教官的栽培与期望。
  英文: This student fell short of success this time. I shall learn from my mistakes,
    summarize experience, and redouble my efforts to live up to the instructor's training
    and expectations.
- Key: Key易万江不用谢……
  中文: '  ……不用谢'
  英文: '...You''re welcome.'
- Key: Key飞虫气血不足……
  中文: 飞虫气血已不足一半！速速施展<color=#a0ff50>强行走</color>身法，让飞虫回到苔蔓上调息回血！
  英文: Your Flying Bug's health is below 50%! Activate the <color=#a0ff50> Force Move</color>
    ability immediately and retreat it to the Mossy Vines to regenerate health!
- Key: Key飞虫在苔蔓上……
  中文: 飞虫正在苔蔓上调息恢复气血，请静待气血回满。
  英文: Your Flying Bug is regenerating health on the Mossy Vines. Wait for it to recover
    fully.
- Key: Key飞虫满血……
  中文: 飞虫气血已回满，可以继续攻敌了！
  英文: Your Flying Bug's health is fully restored! It can resume attacking the enemy.
- Key: Key变异完成
  中文: 变异完成
  英文: Mutation Complete
- Key: 'Key正在变异:'
  中文: '正在变异:'
  英文: 'Mutating In Progress:'
- Key: Key燃气矿不足无法建造
  中文: 燃气矿不足，无法建造
  英文: Insufficient Gas Ore. Construction Unavailable.
- Key: Key燃气矿不足不能升级
  中文: 燃气矿不足，不能升级
  英文: Insufficient Gas Ore. Upgrade Unavailable.
- Key: Key晶体矿不足不能升级
  中文: 晶体矿不足，不能升级
  英文: Insufficient Minerals. Upgrade Unavailable.
- Key: Key已采集{}
  中文: 已采集{}
  英文: 'Harvested: {}'
- Key: Key剩余{}
  中文: 剩余{}
  英文: 'Remaining: {}'
- Key: Key升级进度{}/{}
  中文: 升级进度{}/{}
  英文: Upgrade Progress {}/{}
- Key: Key解锁进度{}/{}
  中文: 解锁进度{}/{}
  英文: Unlock Progress {}/{}
- Key: Key已解锁单位
  中文: 已解锁单位
  英文: Unit Unlocked
- Key: Key属性已升级
  中文: 属性已升级
  英文: Attributes Upgraded
- Key: Key这是每个玩家……
  中文: 这是每个玩家都可以自由共同进入的场景，分布有一些资源和少量的怪，资源的再生速度很慢
  英文: This is a scenario that all players can freely enter together, where some resources
    and a small number of monsters are distributed, and the resource regeneration
    rate is very slow.
- Key: Key您开局只有一辆工程车和一个工虫……
  中文: 您开局只有一辆工程车和一个工虫，工程车可以建造建筑，建筑中可以产出活动单位
  英文: You only have one Construction Vehicle and one Worker Larva at the start of
    the game. The Construction Vehicle can construct buildings, and active units can
    be produced in these buildings.
- Key: Key一旦您退出此……
  中文: 一旦您离开此场景或断线后，您在此场景中的所有单位可能会因为缺少指挥而遭到攻击
  英文: Once you Leave this scenario or disconnect, all your units in this scenario
    may come under attack due to lack of command.
- Key: Key其他玩家是您的敌人……
  中文: 其他玩家是您的敌人，他们可能会向您进攻！
  英文: Other players are your enemies, and they may launch attacks on you!
- Key: Key如果局势对您不利……
  中文: 如果局势对您不利，您可以离开此场景再次进入，就有机会东山再起！
  英文: If the situation turns against you, you can Leave this scenario and re-enter,
